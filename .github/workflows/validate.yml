name: Validate hypercube invariants

on:
  push:
    branches: [research/hypercube-graph-atlas-v2]
  pull_request:

permissions:
  contents: read

jobs:
  graph-and-projection-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check exact combinatorics and preview guard
        run: node __v.mjs
