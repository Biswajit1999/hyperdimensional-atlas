name: Science validation

on:
  pull_request:
  push:
    branches: [main, science-validation-contract-v1]

jobs:
  geometry-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/validate_geometry_contract.mjs
